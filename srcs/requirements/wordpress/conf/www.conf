[www] # The name of the pool you want to configure.  In this case, pool 'www' (default)

#0.0.0.0 = "all IP addresses assigned to this container"
listen = 0.0.0.0:9000

user = www-data
group = www-data

# process manager mode: dynamic adjusts the number of worker processes between min and max depending on load.
pm = dynamic
pm.max_children = 5 # maximum amount of worker processes
pm.start_servers = 2 # workers the service starts with
pm.min_spare_servers = 1 # min idle workers (good to guarantee a free worker for sudden requests)
pm.max_spare_servers = 3 # max idle workers (you don't want too many doing nothing)

