user www-data;
#^^^ preconfigured non-priviledged user and group in Debian for web apps and web servers.
# You want both nginx and php-fpm to have the same user because they share files.  Otherwise you run into permissions issues!
# Here it manages nginx worker processes

events {
    worker_connections 1024; #each worker is allowed to handle 1024 client connections
}

http {
    include /etc/nginx/mime.types; # maps file extensions to MIME types e.g. .html -> text/html.  This helps nginx understand what file type is being requested
    default_type application/octet-stream; #By default, type is a generic binary stream

    server {
        listen 443 ssl; # listen on 443 with TLS
        server_name ramarti2.42.fr;

	ssl_certificate /etc/nginx/ssl/inception.crt;
	ssl_certificate_key /etc/nginx/ssl/inception.key;
	ssl_protocols TLSv1.2 TLSv1.3;


        root /var/www/html; #path in container where WordPress files are
        index index.php index.html; #serve index.php by default (if not, index.html)
        client_max_body_size 64M; #max allowed file upload 64mb

	# Handles anything and looks for it in the root path defined above
        location / {
	#Check if user-requested file exists ($uri) if it's a requested directory, ($uri/) check that.  If not, route request to index.php.
            try_files $uri $uri/ /index.php?$args;
        }

	#catches any URL ending in .php
        location ~ \.php$ {
            fastcgi_pass wordpress:9000; #sends to wordpress:9000
            fastcgi_index index.php; #default index file for fastcgi requests
            include fastcgi_params; #loads standard environment that php needs to process request.
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; #path to requested php script root path + requested script name.
        }
    }
}


