services:
  mariadb:
    build:
     context: requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    networks:
      - inception-network
    volumes:
      - database:/var/lib/mysql #mount db to /var/lib/mysql in container
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    restart: always

  wordpress:
    depends_on:
      - mariadb
    build:
     context: requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    networks:
      - inception-network
    volumes:
      - wordpress_files:/var/www/html
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    restart: always
    
  nginx:
    depends_on:
      - wordpress
    build:
     context: requirements/nginx
    image: nginx:inception
    container_name: nginx
    networks:
      - inception-network
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    env_file:
      - .env
    restart: always

networks:
  inception-network:
    driver: bridge

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  
  wordpress_files:
    driver: local #default driver, means volume lives in local filesystem
    driver_opts:
      type: none #no specialized filesystem.  Just a path.
      o: bind #So that you choose a specific dir on host to mount to container
      device: /home/${USER}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
