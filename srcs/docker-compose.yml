services:
  mariadb:
    #build:
    # context: requirements/mariadb
    image: mariadb:latest #change later
    container_name: mariadb
    networks:
      - inception-network
    volumes:
      - database:/var/lib/mysql #mount db to /var/lib/mysql in container
    environment:
      MYSQL_ROOT_PASSOWRD_FILE: /run/secrets/db_root_password #docker takes secret file on host and mounts it to this path on container!
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    restart: always

  php-fpm:
    depends_on: mariadb
    #build:
    # context: requirements/wordpress
    image: wordpress:fpm
    container_name: php-fpm
    networks:
      - inception-network
    volumes:
      - wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX: wp_
    secrets:
      - db_password
    restart: always
    
  nginx:
    depends_on: php-fpm
    #build:
    # context: requirements/nginx
    image: nginx:latest
    container_name: nginx
    networks:
      - inception-network
    volumes:
      - wordpress:/var/www/html
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    restart: always

networks:
  inception-network:
    driver: bridge

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  
  wordpress:
    driver: local #default driver, means volume lives in local filesystem
    driver_opts:
      type: none #no specialized filesystem.  Just a path.
      o: bind #So that you choose a specific dir on host to mount to container
      device: /home/${USER}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt

