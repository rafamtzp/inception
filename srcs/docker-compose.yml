services:
  mariadb:
    #build:
    # context: requirements/mariadb
    image: mariadb:latest #change later
    container_name: mariadb
    networks:
      - inception-network
    volumes:
      - database:/var/lib/mysql #mount db to /var/lib/mysql in container
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password #docker takes secret file on host and mounts it to this path on container!
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    restart: always

  wordpress:
    depends_on:
      - mariadb
    build:
     context: requirements/wordpress
    image: wordpress:fpm
    container_name: wordpress
    networks:
      - inception-network
    volumes:
      - wordpress_files:/var/www/html
    environment:
      WP_DB_HOST: mariadb #TODO CHANGE ALL NAMES FROM 'WORDPRESS' TO 'WP'
      WP_DB_NAME: ${MYSQL_DATABASE}
      WP_DB_USER: ${MYSQL_USER}
      WP_DB_PASSWORD_FILE: /run/secrets/db_password
      WP_TABLE_PREFIX: wp_
      WP_USER: ${WP_USER} # TO ADD
      WP_ADMIN: ${WP_ADMIN} # TO ADD
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL} # TO ADD
      WP_USER_EMAIL: ${WP_USER_EMAIL} # TO ADD
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    restart: always
    
  nginx:
    depends_on:
      - wordpress
    build:
     context: requirements/nginx
    image: nginx:inception
    container_name: nginx
    networks:
      - inception-network
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    restart: always

networks:
  inception-network:
    driver: bridge

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  
  wordpress_files:
    driver: local #default driver, means volume lives in local filesystem
    driver_opts:
      type: none #no specialized filesystem.  Just a path.
      o: bind #So that you choose a specific dir on host to mount to container
      device: /home/${USER}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt

